<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>近期短影音｜袁之靜</title>
    <meta name="description" content="袁之靜（曉然）近期短影音與作品。">
    <link rel="canonical" href="https://xiaoranart.com/reels">
    <link rel="icon" type="image/x-icon" href="./images/logo/text_white/favicon.ico">
    <link rel="stylesheet" href="./css/palette.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&display=swap">
    <script src="./js/analytics.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); }
        .reels-head { padding: 28px 16px 18px; text-align: center; }
        .reels-head h1 { margin: 0; font: 600 1.6rem/1.3 var(--font-title); letter-spacing: 0.08em; }
        .reels-head a { display: inline-block; margin-top: 8px; color: var(--warm-500); font-size: 0.95rem; text-underline-offset: 3px; }
        .reels-head a:hover { color: var(--ink); }
        .reels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; max-width: 640px; margin: 0 auto 48px; }
        .reel { display: block; aspect-ratio: 9 / 16; background: var(--warm-200); }
        .reel img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .reel:hover img { opacity: 0.85; }
        a:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
        .reel:focus-visible { outline-offset: -2px; }
        @media (min-width: 700px) { .reels-grid { gap: 6px; } }
    </style>
</head>
<body>
    <header class="reels-head">
        <h1 id="reelsTitle">近期短影音</h1>
        <a id="reelsHome" href="/">袁之靜（曉然）作品藝廊</a>
    </header>
    <main class="reels-grid" id="reelsGrid"></main>

    <script>
        (async function () {
            // Same language rule as the main site: the 中/En choice first, then the browser
            const chosen = (document.cookie.match(/(?:^|; )nf_lang=(zh|en)/) || [])[1];
            const zh = (chosen || (/^zh/i.test(navigator.language) ? 'zh' : 'en')) === 'zh';
            if (!zh) {
                document.documentElement.lang = 'en';
                document.title = 'Recent Reels | Yuan Chih-Jin';
                document.getElementById('reelsTitle').textContent = 'Recent Reels';
                document.getElementById('reelsHome').textContent = 'Yuan Chih-Jin (Xiaoran) Gallery';
            }

            const [reels, artworks] = await Promise.all(
                ['./data/reels.json', './data/artworks.json'].map(u => fetch(u).then(r => r.json())));
            const byId = new Map(artworks.map(a => [a.id, a]));
            // Reels go out at 19:00 Taiwan time: counting back 19 hours makes the day turn over then
            const today = new Date(Date.now() - 19 * 3600e3).toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });   // YYYY-MM-DD

            const grid = document.getElementById('reelsGrid');
            reels.filter(r => r.date <= today && byId.has(r.id)).forEach((reel, i) => {
                const artwork = byId.get(reel.id);
                const link = document.createElement('a');
                link.className = 'reel';
                link.href = `/?artwork=${encodeURIComponent(reel.id)}`;
                const img = new Image(540, 960);
                img.src = reel.cover;
                img.alt = zh ? artwork.title : (artwork.titleEn || artwork.title);
                if (i > 8) img.loading = 'lazy';
                link.appendChild(img);
                grid.appendChild(link);
            });
        })();
    </script>
</body>
</html>
