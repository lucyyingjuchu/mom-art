[build]
  functions = "functions"
  # Generates the Chinese page /zh/index.html from index.html (see scripts/build-zh.js)
  command = "node scripts/build-zh.js"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "js/contact-form.js"

# ---- Language: Chinese-language browsers (zh-TW, zh-CN, zh-HK…) go to /zh/ ----
# Others stay on the English home page. The nf_lang cookie (set by the 中/En
# button in js/portfolio.js) overrides the browser language on later visits.
# Query strings such as ?artwork=12 are carried over automatically.
[[redirects]]
  from = "/"
  to = "/zh/"
  status = 302
  force = true
  conditions = {Language = ["zh"]}

# ---- Keep working files off the public website ----
[[redirects]]
  from = "/data/data_processing_scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/artworks_backup*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/missing_images.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/functions/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

# ---- Security headers for every page ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Admin page: never show up in Google
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
