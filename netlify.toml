[build]
  functions = "functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "js/contact-form.js"

# ---- Keep working files off the public website ----
[[redirects]]
  from = "/data/data_processing_scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/artworks_backup*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/missing_images.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/functions/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

# ---- Security headers for every page ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Admin page: never show up in Google
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
