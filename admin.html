        // NEW: Check Netlify deployment status
        async function checkDeploymentStatus(startTime, artworkTitle) {
            const maxAttempts = 60;
            let attempts = 0;
            let initialDeployId = null;
            
            try {
                const initResponse = await fetch('/.netlify/functions/deployStatus');
                if (initResponse.ok) {
                    const initData = await initResponse.json();
                    initialDeployId = initData.deployId;
                    console.log('開始監控，目前部署 ID:', initialDeployId);
                }
            } catch (error) {
                console.log('無法取得初始部署狀態');
            }
            
            const checkStatus = async () => {
                try {
                    attempts++;
                    
                    const response = await fetch('/.netlify/functions/deployStatus');
                    if (!response.ok) {
                        throw new Error('Failed to check deployment status');
                    }
                    
                    const data = await response.json();
                    
                    if (initialDeployId && data.deployId !== initialDeployId) {
                        console.log('偵測到新部署！', data.deployId);
                        
                        if (data.status === 'ready') {
                            showMessage(`✅ 作品「${artworkTitle}」已成功發布到網站！`, 'success');
                            
                            const deployNotice = document.querySelector('.deployment-notice');
                            if (deployNotice) {
                                deployNotice.remove();
                            }
                            
                            const successNotice = document.createElement('div');
                            successNotice.className = 'success-message';
                            successNotice.innerHTML = `
                                <strong>🎉 發布完成！</strong><br>
                                作品「${artworkTitle}」已成功發布到網站。<br>
                                <a href="https://xiaran.netlify.app" target="_blank" style="color: #155724;">點此查看網站 →</a>
                            `;
                            const container = document.querySelector('.container');
                            container.insertBefore(successNotice, container.firstChild.nextSibling);
                            
                            setTimeout(() => successNotice.remove(), 10000);
                            return;
                            
                        } else if (data.status === 'building' || data.status === 'processing') {
                            console.log('還在建構中...');
                        }
                    }
                    
                    if (attempts < maxAttempts) {
                        setTimeout(checkStatus, 5000);
                    } else {
                        showMessage('發布檢查超時，請手動確認網站更新狀態。', 'warning');
                    }
                    
                } catch (error) {
                    console.error('Error checking deployment:', error);
                    if (attempts === 1) {
                        showMessage(`作品「${artworkTitle}」已提交，預計 2-3 分鐘後生效。`, 'info');
                    }
                }
            };
    
            setTimeout(checkStatus, 10000);
        }

        // Publish function
        async function publishArtwork() {
            if (!checkEditingPermission()) return;
            
            const draftId = currentEditingId || 'new';
            const draft = localDrafts[draftId];
            
            if (!draft) {
                showMessage('沒有草稿可發布！請先儲存。', 'error');
                return;
            }

            try {
                const publishBtn = document.getElementById('publishBtn');
                const saveStatus = document.getElementById('saveStatus');
                
                publishBtn.disabled = true;
                saveStatus.innerHTML = '🚀 發布中...';

                const pendingImageKey = currentEditingId || 'pending';
                
                if (uploadedImages[pendingImageKey] && uploadedImages[pendingImageKey].cleared) {
                    draft.image = '';
                    draft.imageHigh = '';
                    console.log('圖片已清除，設定為空字串');
                    
                } else if (uploadedImages[pendingImageKey] && uploadedImages[pendingImageKey].file) {
                    saveStatus.innerHTML = '📤 上傳圖片至 GitHub...';
                    
                    try {
                        const uploadResult = await window.githubUploader.uploadArtwork(
                            uploadedImages[pendingImageKey].file,
                            { id: draft.id, title: draft.title }
                        );

                        // use the paths the uploader actually wrote (.jpg)
                        draft.image = uploadResult.artworkData.image;
                        draft.imageHigh = uploadResult.artworkData.imageHigh;
                        // the gallery sizes each painting by its photo's shape
                        try {
                            const bmp = await createImageBitmap(uploadedImages[pendingImageKey].file);
                            draft.imageRatio = Math.round(bmp.width / bmp.height * 1000) / 1000;
                            bmp.close();
                        } catch (e) {
                            delete draft.imageRatio;   // the gallery measures it on load
                        }
                        
                        URL.revokeObjectURL(uploadedImages[pendingImageKey].localPreview);
                        delete uploadedImages[pendingImageKey];
                    } catch (uploadError) {
                        console.error('圖片上傳失敗:', uploadError);
                        showMessage('圖片上傳失敗，但會繼續儲存其他資料', 'warning');
                    }
                }

                updateArtworkInMasterArray(draft);

                saveStatus.innerHTML = '🌐 更新網站中...';
                
                try {
                    const masterArray = getMasterArtworksArray();
                    console.log(`🔒 SAFETY CHECK: Publishing ${masterArray.length} artworks to GitHub`);
                    await window.githubUploader.updateArtworksJson(masterArray);
                    
                    const deployStartTime = Date.now();
                    saveStatus.innerHTML = '✅ 已提交更新';
                    publishBtn.disabled = false;
                    
                    showMessage(`作品「${draft.title}」已成功提交！正在監控部署狀態...`, 'success');
                    
                    const deploymentNotice = document.createElement('div');
                    deploymentNotice.className = 'info-message deployment-notice';
                    deploymentNotice.innerHTML = `
                        <strong>📦 發佈狀態</strong><br>
                        <div id="deployStatus">⏳ Netlify 正在自動發佈您的更新...</div>
                        <small>• 系統將自動檢查發佈進度</small><br>
                        <small>• 發佈完成後會通知您</small><br>
                    `;
                    
                    const container = document.querySelector('.container');
                    container.insertBefore(deploymentNotice, container.firstChild.nextSibling);
                    
                    checkDeploymentStatus(deployStartTime, draft.title);
                    
                } catch (deployError) {
                    console.error('發佈失敗:', deployError);
                    saveStatus.innerHTML = '❌ 發佈失敗';
                    publishBtn.disabled = false;
                    
                    if (deployError.message.includes('JSON')) {
                        showMessage('發佈失敗：伺服器回應格式錯誤，可能是檔案太大或網路問題。請稍後再試。', 'error');
                    } else {
                        showMessage(`發佈失敗：${deployError.message}`, 'error');
                    }
                    
                    return;
                }
                
                delete localDrafts[draftId];
                if (uploadedImages[draft.id]) {
                    delete uploadedImages[draft.id];
                }
                
                window.artworks = getMasterArtworksArray();
                renderArtworks();
                updateStats();
                
                setTimeout(() => {
                    closeModal();
                }, 3000);

            } catch (error) {
                console.error('Publish failed:', error);
                document.getElementById('saveStatus').innerHTML = '❌ 發布失敗';
                document.getElementById('publishBtn').disabled = false;
                showMessage(`發布失敗：${error.message}`, 'error');
            }
        }

        // CLEANED UP: Collect form data function
        function collectArtworkFormData(artworkId) {
            // Validate required fields
            const title = document.getElementById('artworkTitle').value.trim();
            const year = document.getElementById('artworkYear').value.trim();
            const height = document.getElementById('artworkHeight').value.trim();
            const width = document.getElementById('artworkWidth').value.trim();
            
            if (!title) throw new Error('請填寫作品標題');
            if (!year) throw new Error('請填寫創作年份');
            if (!height) throw new Error('請填寫作品高度');
            if (!width) throw new Error('請填寫作品寬度');
            
            // Get existing artwork if editing
            let existingArtwork = {};
            if (currentEditingId) {
                existingArtwork = allArtworks.find(a => a.id === currentEditingId) || {};
            }
            
            // Start from the existing record so fields the form doesn't show
            // (English texts, mockup views, series, photo shape, status...) are kept
            const formData = {
                ...existingArtwork,
                id: artworkId,
                title: title,
                year: year,
                heightCm: parseFloat(height),
                widthCm: parseFloat(width),
                sizeCm: `${height} × ${width} cm`,
                heightInches: parseFloat((parseFloat(height) / 2.54).toFixed(1)),
                widthInches: parseFloat((parseFloat(width) / 2.54).toFixed(1)),
                format: document.getElementById('artworkFormat').value.trim(),
                series: document.getElementById('artworkSeries').value.trim(),
                titleEn: document.getElementById('artworkTitleEn').value.trim(),
                descriptionEn: document.getElementById('artworkDescriptionEn').value.trim(),
                curatorNoteEn: document.getElementById('artworkCuratorNoteEn').value.trim(),
                description: document.getElementById('artworkDescription').value.trim(),
                curatorNote: document.getElementById('artworkCuratorNote').value.trim(),
                featured: document.getElementById('artworkFeatured').checked,
                available: document.getElementById('artworkAvailable').checked,
                price: document.getElementById('artworkPrice').value.trim(),
                
                // CLEANED UP: Use current category structure
                autoCategories: {
                    subjects: [...(currentArtworkCategories.autoCategories.subjects || [])],
                    locations: [...(currentArtworkCategories.autoCategories.locations || [])]
                },
                manualCategories: {
                    subjects: [...(currentArtworkCategories.manualCategories.subjects || [])],
                    locations: [...(currentArtworkCategories.manualCategories.locations || [])]
                },
                
                // Preserve existing image paths if no new image
                image: existingArtwork.image || '',
                imageHigh: existingArtwork.imageHigh || ''
            };
            
            // The old flat "categories" list would bring back guesses the hand-picked tags replace
            delete formData.categories;

            // English series name and mounting: reuse what other works with the same
            // Chinese name already use (the English site shows these)
            formData.seriesEn = englishFor('series', 'seriesEn', formData, existingArtwork);
            formData.formatEn = englishFor('format', 'formatEn', formData, existingArtwork);
            if (!formData.series) { delete formData.series; delete formData.seriesEn; }

            console.log(`📋 Form data collected for ${artworkId}`);
            console.log(`   Auto: ${formData.autoCategories.subjects.length} subjects, ${formData.autoCategories.locations.length} locations`);
            console.log(`   Manual: ${formData.manualCategories.subjects.length} subjects, ${formData.manualCategories.locations.length} locations`);
            
            return formData;
        }

        // English counterpart of a Chinese field (series, format): keep the work's own if the
        // Chinese didn't change, otherwise borrow it from another work with the same Chinese
        function englishFor(field, fieldEn, formData, existing) {
            const zh = formData[field] || '';
            if (!zh) return '';
            if (existing[field] === zh && existing[fieldEn]) return existing[fieldEn];
            const other = allArtworks.find(a => a[field] === zh && a[fieldEn]);
            return other ? other[fieldEn] : '';
        }

        // Existing series names for the 系列 suggestions
        function fillSeriesOptions() {
            const names = [...new Set(allArtworks.map(a => a.series).filter(Boolean))];
            document.getElementById('seriesOptions').innerHTML =
                names.map(n => `<option value="${n}">`).join('');
        }

        // Utility functions
        // Same order and grouping as the website: year headings, series labels
        function renderArtworks(artworksToShow = artworks) {
            const grid = document.getElementById('artworksGrid');
            const empty = (title, text) =>
                `<div style="text-align: center; padding: 3rem; color: #7f8c8d;"><h3>${title}</h3><p>${text}</p></div>`;

            if (allArtworks.length === 0) {
                grid.innerHTML = empty('尚無作品', '點擊「新增作品」開始！');
                return;
            }
            if (artworksToShow.length === 0) {
                grid.innerHTML = empty('沒有符合的作品', '請換個分頁或搜尋字詞。');
                return;
            }

            const cm = window.categoryManager;
            const yearOf = a => cm && cm.galleryYear ? cm.galleryYear(a) : (parseInt(a.year) || -1);
            const sorted = cm && cm.sortForGallery ? cm.sortForGallery(artworksToShow, allArtworks) : artworksToShow;

            const groups = [];
            for (const a of sorted) {
                const year = yearOf(a);
                const key = year + '|' + (a.series || '');
                const last = groups[groups.length - 1];
                if (last && last.key === key) last.items.push(a);
                else groups.push({ key, year, series: a.series || '', seriesEn: a.seriesEn || '', items: [a] });
            }

            let previousYear = null;
            grid.innerHTML = groups.map(g => {
                const heading = g.year !== previousYear
                    ? `<h3 class="list-year">${g.year > 0 ? g.year : '年份不詳'}</h3>` : '';
                previousYear = g.year;
                const series = g.series
                    ? `<h4 class="list-series">系列：${g.series}${g.seriesEn ? `<small>${g.seriesEn}</small>` : ''}</h4>` : '';
                return `${heading}${series}<div class="artworks-grid">${g.items.map(renderArtworkCard).join('')}</div>`;
            }).join('');
        }

        function renderArtworkCard(artwork) {
            const cm = window.categoryManager;
            const imageUrl = artwork.image || './images/placeholder/artwork-placeholder-zh.svg';
            const title = artwork.title || '未命名';
            const year = artwork.year || '年份不詳';
            const size = artwork.heightCm && artwork.widthCm
                ? `${artwork.heightCm} × ${artwork.widthCm} cm`
                : artwork.sizeCm || artwork.size || '尺寸未註明';
            const draft = isDraftArtwork(artwork);
            const featured = artwork.featured === 'true' || artwork.featured === true;
            const sold = artwork.available === false || artwork.available === 'false';
            const tabs = cm && cm.getArtworkTabs ? cm.getArtworkTabs(artwork) : [];

            const badges = [
                draft ? '<span class="badge warn">📝 草稿・網站不顯示</span>' : '',
                sold ? '<span class="badge sold">已售</span>' : '',
                featured ? '<span class="badge featured">⭐ 首頁精選</span>' : '',
                printReadyIds.has(artwork.id) ? '<span class="badge print">🖨️ 可買版畫</span>' : '',
                ...tabs.map(t => `<span class="badge">${t.zh}</span>`),
                !draft && !tabs.length ? '<span class="badge warn">沒有題材・只在「全部」</span>' : ''
            ].join('');

            return `
                <div class="artwork-card${draft ? ' is-draft' : ''}">
                    <img src="${imageUrl}" alt="${title}" class="artwork-image" loading="lazy"
                         onclick="editArtwork('${artwork.id}')"
                         onerror="this.src='./images/placeholder/artwork-placeholder-zh.svg'">
                    <div class="artwork-info">
                        <div class="artwork-title">${title}</div>
                        <div class="artwork-meta">${year} • ${size}</div>
                        <div class="card-badges">${badges}</div>
                        <div class="artwork-actions">
                            <button class="btn btn-small" onclick="editArtwork('${artwork.id}')">✏️ 編輯</button>
                            <button class="btn btn-danger btn-small" onclick="deleteArtwork('${artwork.id}')">🗑️ 刪除</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Counts for the whole collection (not just the open tab)
        function updateStats() {
            const shown = allArtworks.filter(a => !isDraftArtwork(a));
            document.getElementById('totalArtworks').textContent = allArtworks.length;
            document.getElementById('publicCount').textContent = shown.length;
            document.getElementById('draftCount').textContent = allArtworks.length - shown.length;
            document.getElementById('printCount').textContent = shown.filter(a => printReadyIds.has(a.id)).length;
        }

        function showMessage(message, type) {
            const existingMessages = document.querySelectorAll('.success-message, .error-message, .info-message, .warning-message');
            existingMessages.forEach(msg => msg.remove());
            
            const messageDiv = document.createElement('div');
            let className = 'success-message';
            if (type === 'error') className = 'error-message';
            if (type === 'info') className = 'info-message';
            if (type === 'warning') className = 'warning-message';
            
            messageDiv.className = className;
            messageDiv.textContent = message;
            
            const container = document.querySelector('.container');
            container.insertBefore(messageDiv, container.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // CLEANED UP: Load artworks function
        async function loadArtworks() {
            try {
                console.log('🚀 Starting loadArtworks()...');
                
                // Don't wait for CategoryManager - proceed with or without it
                let categoryManagerReady = false;
                if (typeof categoryManager !== 'undefined' && categoryManager.loadConfig) {
                    try {
                        await categoryManager.loadConfig();
                        categoryManagerReady = true;
                        console.log('✅ CategoryManager ready');
                    } catch (error) {
                        console.warn('⚠️ CategoryManager not ready, continuing without it');
                    }
                }
                
                const response = await fetch('./data/artworks.json', { cache: 'no-store' });
                const data = await response.json();
                
                allArtworks = Array.isArray(data) ? data : [];
                artworks = [...allArtworks];
                window.artworks = getMasterArtworksArray();

                // Which works have print sizes (shown as 🖨️ 可買版畫)
                try {
                    const prints = await (await fetch('./data/finerworks_ready_artworks.json')).json();
                    printReadyIds = new Set(Object.keys(prints).filter(id =>
                        prints[id] && prints[id].print_ready !== false && (prints[id].recommended_sizes || []).length));
                } catch (e) {
                    console.warn('Print list not loaded:', e);
                }

                if (!categoryManagerReady) console.warn('⚠️ CategoryManager not ready - tabs show 全部 only');
                generateAdminFilters();
                applyAdminFilters();
                
            } catch (error) {
                console.error('Error loading artworks:', error);
                showMessage(`載入作品失敗：${error.message}`, 'error');
                allArtworks = [];
                artworks = [];
                window.artworks = [];
            }
        }
        // Check GitHub connection and update UI
        async function checkGitHubConnection() {
            try {
                if (window.githubUploader) {
                    const connected = await window.githubUploader.testConnection();
                    const statusEl = document.getElementById('githubStatus');
                    const warningEl = document.getElementById('connectionWarning');
                    const addButton = document.querySelector('.btn-success');
                    
                    if (connected.success) {
                        isConnected = true;
                        statusEl.className = 'github-status status-connected';
                        statusEl.textContent = `✅ 已連線至 ${connected.repoName}`;
                        warningEl.style.display = 'none';
                        if (addButton) addButton.disabled = false;
                    } else {
                        isConnected = false;
                        statusEl.className = 'github-status status-disconnected';
                        statusEl.textContent = `❌ 連線失敗`;
                        warningEl.style.display = 'block';
                        if (addButton) addButton.disabled = true;
                    }
                } else {
                    setTimeout(checkGitHubConnection, 1000);
                }
            } catch (error) {
                isConnected = false;
                const statusEl = document.getElementById('githubStatus');
                const warningEl = document.getElementById('connectionWarning');
                statusEl.className = 'github-status status-disconnected';
                statusEl.textContent = `❌ 連線錯誤`;
                warningEl.style.display = 'block';
            }
        }

        // Image upload handling
        function setupImageUpload() {
            const imageInput = document.getElementById('imageInput');
            const uploadArea = document.querySelector('.upload-area');
            
            imageInput.addEventListener('change', handleImageUploadWithGitHub);
            setupDragAndDrop(uploadArea, imageInput);
            
            console.log('✅ 使用 GitHub 圖片上傳 + 拖放功能');
        }

        function setupDragAndDrop(uploadArea, fileInput) {
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                uploadArea.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                uploadArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                uploadArea.addEventListener(eventName, unhighlight, false);
            });

            uploadArea.addEventListener('drop', handleDrop, false);

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            function highlight(e) {
                uploadArea.classList.add('drag-over');
            }

            function unhighlight(e) {
                uploadArea.classList.remove('drag-over');
            }

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;

                if (files.length > 0) {
                    const file = files[0];
                    
                    if (!file.type.startsWith('image/')) {
                        showMessage('請拖放圖片檔案！', 'warning');
                        return;
                    }

                    if (file.size > 50 * 1024 * 1024) {
                        showMessage('圖片太大，請使用 50MB 以下的圖片。', 'error');
                        return;
                    }

                    const mockEvent = {
                        target: {
                            files: [file]
                        }
                    };

                    handleImageUploadWithGitHub(mockEvent);
                }
            }
        }

        // CLEANED UP: Initialize everything
        document.addEventListener('DOMContentLoaded', function() {
            loadArtworks();
            setupImageUpload();

            // Check GitHub connection on startup
            setTimeout(checkGitHubConnection, 1000);
            
            // Re-check connection every 30 seconds
            setInterval(checkGitHubConnection, 30000);

            // Form handler - SAVES DRAFT LOCALLY
            document.getElementById('artworkForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (!checkEditingPermission()) return;
                
                const artworkId = currentEditingId || generateSequentialId();
                
                try {
                    const formData = collectArtworkFormData(artworkId);
                    
                    // Handle image paths for existing artwork
                    if (currentEditingId) {
                        const existingArtwork = allArtworks.find(a => a.id === currentEditingId);
                        if (existingArtwork) {
                            if (uploadedImages[currentEditingId] && uploadedImages[currentEditingId].cleared) {
                                formData.image = '';
                                formData.imageHigh = '';
                            } else if (!uploadedImages[artworkId] || !uploadedImages[artworkId].file) {
                                formData.image = existingArtwork.image || '';
                                formData.imageHigh = existingArtwork.imageHigh || '';
                            }
                        }
                    }
                    
                    if (uploadedImages[artworkId] && uploadedImages[artworkId].githubUpload) {
                        formData.image = uploadedImages[artworkId].githubUpload.artworkData.image;
                        formData.imageHigh = uploadedImages[artworkId].githubUpload.artworkData.imageHigh;
                    }
                    
                    // Save as local draft
                    const draftId = currentEditingId || 'new';
                    localDrafts[draftId] = formData;
                    
                    // Update UI
                    const publishBtn = document.getElementById('publishBtn');
                    const saveStatus = document.getElementById('saveStatus');
                    
                    publishBtn.disabled = false;
                    saveStatus.innerHTML = '⚠️ 草稿已儲存在本地 - 瀏覽器關閉將會遺失';
                    
                    showMessage('草稿已儲存！點擊「發布」使其生效。', 'success');
                    
                } catch (error) {
                    showMessage(error.message, 'error');
                }
            });

            // Modal close on outside click
            window.onclick = function(event) {
                const modal = document.getElementById('artworkModal');
                if (event.target === modal) {
                    closeModal();
                }
            }
        });

        // Make functions globally available
        window.artworks = getMasterArtworksArray;
        window.renderArtworks = renderArtworks;
        window.updateStats = updateStats;
        window.showMessage = showMessage;
        window.publishArtwork = publishArtwork;
        window.undoDelete = undoDelete;
        window.clearImage = clearImage;
        
        console.log('✅ 管理介面載入成功 - 使用 CategoryManager 進行分類管理！');
    </script>
</body>
</html>
